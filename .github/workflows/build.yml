name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test phone-side JS
        run: node test/pkjs.test.js

      - name: Check watch translations
        run: node test/i18n.test.js

      - name: Check formatting (clang-format, Google style)
        run: |
          clang-format --version
          clang-format --dry-run --Werror src/c/*.c src/c/*.h src/pkjs/*.js test/*.js

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install Pebble tool and SDK
        run: |
          uv tool install pebble-tool --python 3.13
          yes | pebble sdk install latest

      # stdin from /dev/null so an unexpected prompt fails instead of hanging
      - name: Build
        timeout-minutes: 10
        # the bundle is named after the checkout folder, so give it the app
        # name unless the folder already has it
        run: |
          pebble build < /dev/null
          pbw=$(ls build/*.pbw)
          if [ "$pbw" != build/ostrakon.pbw ]; then mv "$pbw" build/ostrakon.pbw; fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the minified phone-side JS
        run: PKJS_BUNDLE=build/pebble-js-app.js node test/pkjs.test.js

      - uses: actions/upload-artifact@v7
        with:
          name: Ostrakon
          path: build/ostrakon.pbw
