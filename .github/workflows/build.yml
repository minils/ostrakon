name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test phone-side JS
        run: node test/pkjs.test.js

      - name: Check watch translations
        run: node test/i18n.test.js

      - name: Check formatting (clang-format, Google style)
        run: |
          clang-format --version
          clang-format --dry-run --Werror src/c/*.c src/c/*.h src/pkjs/*.js test/*.js

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install Pebble tool and SDK
        run: |
          uv tool install pebble-tool --python 3.13
          yes | pebble sdk install latest

      # stdin from /dev/null so an unexpected prompt fails instead of hanging
      - name: Build
        timeout-minutes: 10
        # the bundle is named after the checkout folder, so give it the app
        # name unless the folder already has it
        run: |
          pebble build < /dev/null
          pbw=$(ls build/*.pbw)
          if [ "$pbw" != build/ostrakon.pbw ]; then mv "$pbw" build/ostrakon.pbw; fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the minified phone-side JS
        run: PKJS_BUNDLE=build/pebble-js-app.js node test/pkjs.test.js

      - uses: actions/upload-artifact@v7
        with:
          name: Ostrakon
          path: build/ostrakon.pbw

  # a tag like v1.0.0 makes a draft release with the .pbw, to check and
  # publish by hand
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          name: Ostrakon

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ostrakon.pbw \
            --draft --title "Ostrakon ${GITHUB_REF_NAME#v}" --generate-notes
